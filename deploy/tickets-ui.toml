# tickets-ui v0 deploy sub-manifest (packr 0.24 / theater d1a9f270).
# Handlers: self (log/shutdown) + tcp. NO runtime/supervisor handler — the UI
# spawns no children. This is the CORRECTED shape; the in-repo release.yml still
# emits `type = "runtime"` and must be fixed (runtime -> self) before its CI
# release asset #2 is usable — that edit needs `workflow` token scope (Colin/mgr).
#
# For push-spawn: `supervisor push --manifest this --wasm tickets_ui.wasm`.
# `package` below is the canonical release URL form (fill <TAG>/<STAGE>); push
# mode ships the bytes via --wasm and does not fetch it.
#
# initial_state is injected at deploy time (manager's initial deploy). Shape:
#   {"api_addr":"127.0.0.1:8456","api_token":"<shared tickets bearer>","listen_addr":"127.0.0.1:9445"}
name = "tickets-ui"
version = "0.1.0"
package = "https://github.com/colinrozzi/tickets-ui/releases/download/<TAG>/tickets_ui-<STAGE>.wasm"
static_package = true

[[handler]]
type = "self"

[[handler]]
type = "tcp"
